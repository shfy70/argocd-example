apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: efk
  labels:
    app: kibana
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: kibana

  template:
    metadata:
      labels:
        app: kibana

    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: wait-for-elasticsearch
          image: curlimages/curl:8.16.0

          command:
            - /bin/sh
            - -c
            - |
              until curl -fsS http://elasticsearch:9200; do
                echo "Waiting for Elasticsearch"
                sleep 5
              done

        - name: prepare-kibana-data
          image: busybox:1.36.1

          command:
            - /bin/sh
            - -c
            - |
              echo "Preparing Kibana data directory"
              chown -R 1000:1000 /usr/share/kibana/data
              chmod -R 0770 /usr/share/kibana/data
              ls -la /usr/share/kibana/data

          securityContext:
            runAsUser: 0

          volumeMounts:
            - name: kibana-data
              mountPath: /usr/share/kibana/data

      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.17
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5601
              protocol: TCP

          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch:9200"]'

            - name: SERVER_HOST
              value: "0.0.0.0"

            - name: SERVER_NAME
              value: kibana

            - name: TELEMETRY_ENABLED
              value: "false"

          resources:
            requests:
              cpu: "250m"
              memory: 1Gi

            limits:
              cpu: "1"
              memory: 2Gi

          startupProbe:
            httpGet:
              path: /api/status
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/status
              port: http

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            tcpSocket:
              port: http

            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            - name: kibana-data
              mountPath: /usr/share/kibana/data

      volumes:
        - name: kibana-data
          persistentVolumeClaim:
            claimName: kibana-data
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: efk
spec:
  type: ClusterIP

  selector:
    app: kibana

  ports:
    - name: http
      port: 5601
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-lb
  namespace: efk
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster

  selector:
    app: kibana

  ports:
    - name: http
      port: 5601
      targetPort: http
      protocol: TCP
