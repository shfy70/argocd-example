apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: efk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd-efk
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd-efk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd-efk
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: efk
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: efk
data:
  fluent.conf: |
    <system>
      log_level info
    </system>

    <source>
      @type tail
      @id kubernetes-container-logs

      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos

      tag kubernetes.*
      read_from_head false

      <parse>
        @type multi_format

        <pattern>
          format regexp
          expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$/
          time_format %Y-%m-%dT%H:%M:%S.%N%:z
        </pattern>

        <pattern>
          format json
          time_key time
          time_type string
          time_format %Y-%m-%dT%H:%M:%S.%N%:z
          keep_time_key true
        </pattern>
      </parse>
    </source>

    <source>
      @type forward
      @id forward-input
      bind 0.0.0.0
      port 24224
    </source>

    <filter kubernetes.**>
      @type kubernetes_metadata
      skip_labels false
      skip_container_metadata false
      skip_namespace_metadata false
    </filter>

    <match kubernetes.var.log.containers.fluentd-**>
      @type null
    </match>

    <match **>
      @type elasticsearch
      @id elasticsearch-output

      host elasticsearch
      port 9200
      scheme http

      logstash_format true
      logstash_prefix kubernetes

      include_tag_key true
      tag_key fluentd_tag

      suppress_type_name true
      reconnect_on_error true
      reload_on_failure true
      reload_connections false
      request_timeout 30s

      <buffer>
        @type file
        path /var/log/fluentd-buffer/elasticsearch

        flush_mode interval
        flush_interval 5s
        flush_thread_count 2

        retry_type exponential_backoff
        retry_forever true
        retry_max_interval 30

        chunk_limit_size 2m
        total_limit_size 512m
        overflow_action block
      </buffer>
    </match>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: efk
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd

  template:
    metadata:
      labels:
        app: fluentd

    spec:
      serviceAccountName: fluentd
      terminationGracePeriodSeconds: 30

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist

      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.19.3-debian-elasticsearch8-amd64-1.0
          imagePullPolicy: IfNotPresent

          env:
            - name: FLUENTD_CONF
              value: fluent.conf

            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          ports:
            - name: forward-tcp
              containerPort: 24224
              protocol: TCP

            - name: forward-udp
              containerPort: 24224
              protocol: UDP

          resources:
            requests:
              cpu: "100m"
              memory: 200Mi

            limits:
              cpu: "500m"
              memory: 512Mi

          securityContext:
            runAsUser: 0

          livenessProbe:
            tcpSocket:
              port: forward-tcp

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            - name: config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
              readOnly: true

            - name: varlog
              mountPath: /var/log
              readOnly: false

            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true

            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: fluentd-config

        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

        - name: container-logs
          hostPath:
            path: /var/log/containers
            type: Directory

        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: fluentd
  namespace: efk
spec:
  type: ClusterIP

  selector:
    app: fluentd

  ports:
    - name: forward-tcp
      port: 24224
      targetPort: forward-tcp
      protocol: TCP

    - name: forward-udp
      port: 24224
      targetPort: forward-udp
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: fluentd-lb
  namespace: efk
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster

  selector:
    app: fluentd

  ports:
    - name: forward-tcp
      port: 24224
      targetPort: forward-tcp
      protocol: TCP

    - name: forward-udp
      port: 24224
      targetPort: forward-udp
      protocol: UDP
