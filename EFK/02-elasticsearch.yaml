apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: efk
  labels:
    app: elasticsearch
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: elasticsearch

  template:
    metadata:
      labels:
        app: elasticsearch

    spec:
      terminationGracePeriodSeconds: 120

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: prepare-elasticsearch-data
          image: busybox:1.36.1

          command:
            - /bin/sh
            - -c
            - |
              echo "Preparing Elasticsearch data directory"
              chown -R 1000:1000 /usr/share/elasticsearch/data
              chmod -R 0770 /usr/share/elasticsearch/data
              ls -la /usr/share/elasticsearch/data

          securityContext:
            runAsUser: 0

          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data

      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.17
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9200
              protocol: TCP

            - name: transport
              containerPort: 9300
              protocol: TCP

          env:
            - name: node.name
              value: elasticsearch-0

            - name: cluster.name
              value: subaru-efk

            - name: discovery.type
              value: single-node

            - name: xpack.security.enabled
              value: "false"

            - name: xpack.security.http.ssl.enabled
              value: "false"

            - name: xpack.security.transport.ssl.enabled
              value: "false"

            - name: bootstrap.memory_lock
              value: "false"

            - name: ES_JAVA_OPTS
              value: "-Xms3g -Xmx3g"

          resources:
            requests:
              cpu: "750m"
              memory: 4Gi

            limits:
              cpu: "2"
              memory: 6Gi

          startupProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            tcpSocket:
              port: http

            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data

      volumes:
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: efk
spec:
  type: ClusterIP

  selector:
    app: elasticsearch

  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP

    - name: transport
      port: 9300
      targetPort: transport
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-lb
  namespace: efk
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster

  selector:
    app: elasticsearch

  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
